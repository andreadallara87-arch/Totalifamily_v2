<!doctype html>
<html lang="it" class="tf scuro blu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Totalifamily" />
    <meta name="description" content="Le finanze di famiglia, al sicuro." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" />
    <title>Totalifamily</title>
    <script>
      try {
        var v = JSON.parse(localStorage.getItem('tf-aspetto') || '{}')
        var t = v.theme === 'chiaro' ? 'chiaro' : 'scuro'
        var a = /^(blu|lime|viola|arancio|rosa|menta|oro|neutro)$/.test(v.accent) ? v.accent : 'blu'
        document.documentElement.className = 'tf ' + t + ' ' + a
        if (t === 'chiaro') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F1F1F4')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
